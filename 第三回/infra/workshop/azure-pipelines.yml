trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # 全タスク共通で非対話モードを強制（変数未設定時にハングせず即エラー）
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o terraform.zip
      unzip -q terraform.zip
      sudo mv terraform /usr/local/bin/terraform
      terraform version
    displayName: Install Terraform

  - task: AzureCLI@2
    displayName: Terraform init
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        echo "Terraform backend target: ${TF_STATE_STORAGE_ACCOUNT_NAME}/${TF_STATE_CONTAINER_NAME}/${TF_STATE_KEY}"

        terraform init -input=false \
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP_NAME}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT_NAME}" \
          -backend-config="container_name=${TF_STATE_CONTAINER_NAME}" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="key=${TF_STATE_KEY}"

  - task: AzureCLI@2
    displayName: Terraform validate
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        terraform validate

  - task: AzureCLI@2
    displayName: Terraform plan
    env:
      # 【最重要】DevOpsの大文字変換を回避し、小文字の変数名でTerraformへ渡す。
      # 右辺 $(...) のマクロ参照は大小無視で値を取得できるが、左辺(=実際の環境変数名)は
      # Terraformが要求する変数名と完全一致(小文字)でなければならない。
      TF_VAR_resource_group_name: $(TF_VAR_resource_group_name)
      TF_VAR_owner: $(TF_VAR_owner)
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        # ロック取得前に必須変数の欠落を検出して即停止
        : "${TF_VAR_resource_group_name:?TF_VAR_resource_group_name is not set.}"
        : "${TF_VAR_owner:?TF_VAR_owner is not set.}"

        terraform plan -input=false -lock-timeout=5m -out=tfplan

  - task: AzureCLI@2
    displayName: Terraform apply
    env:
      TF_VAR_resource_group_name: $(TF_VAR_resource_group_name)
      TF_VAR_owner: $(TF_VAR_owner)
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        : "${TF_VAR_resource_group_name:?TF_VAR_resource_group_name is not set.}"
        : "${TF_VAR_owner:?TF_VAR_owner is not set.}"

        terraform apply -input=false -lock-timeout=5m -auto-approve tfplan