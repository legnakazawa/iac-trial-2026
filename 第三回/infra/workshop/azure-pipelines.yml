trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o terraform.zip
      unzip -q terraform.zip
      sudo mv terraform /usr/local/bin/terraform
      terraform version
    displayName: Install Terraform

  - task: AzureCLI@2
    displayName: Terraform init
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        echo "Terraform backend target: ${TF_STATE_STORAGE_ACCOUNT_NAME}/${TF_STATE_CONTAINER_NAME}/${TF_STATE_KEY}"

        terraform init \
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP_NAME}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT_NAME}" \
          -backend-config="container_name=${TF_STATE_CONTAINER_NAME}" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="key=${TF_STATE_KEY}"

  - task: AzureCLI@2
    displayName: Terraform validate
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        terraform validate

  - task: AzureCLI@2
    displayName: Terraform plan
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        terraform plan -lock-timeout=1m -out=tfplan

  - task: AzureCLI@2
    displayName: Terraform apply
    inputs:
      azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="${servicePrincipalId}"
        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
        export ARM_TENANT_ID="${tenantId}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_AZUREAD=true

        terraform apply -lock-timeout=1m -auto-approve tfplan
